openapi: "3.0.3"
info:
  title: Greeting API
  description: A short description of API.
  version: 1.0.0
servers:
  - url: https://p2hacks2024-test-api-993119829902.asia-northeast1.run.app
    description: Production Server
  - url: https://p2hacks2024-test-api-stg-993119829902.asia-northeast1.run.app
    description: Staging Server
  - url: https://p2hacks2024-test-api-dev-993119829902.asia-northeast1.run.app
    description: Development Server
  - url: http://localhost:8081
    description: Local Server
paths:
  /hello:
    get:
      tags: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Greeting"
              example:
                message: Hello, World!
        "401":
          description: Unauthorized
      parameters:
        - in: header
          name: X-Firebase-AppCheck
          schema:
            type: string
          required: true
          description: Firebase App Check Token
    post:
      tags: []
      security:
        - AuthBearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Greeting"
              example:
                message: Hello, John!
        "401":
          description: Unauthorized
      parameters:
        - in: header
          name: X-Firebase-AppCheck
          schema:
            type: string
          required: true
          description: Firebase App Check Token
      requestBody:
        description: Greeting Message
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Greeting"
            example:
              message: Hello, API!
components:
  schemas:
    Greeting:
      type: object
      properties:
        message:
          type: string
  securitySchemes:
    AuthBearer:
      type: http
      scheme: bearer
      description: Bearer Access Token for Authorization
